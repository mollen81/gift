<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Математическая задача</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .task-card {
            width: 600px;
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .task {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .answer-input {
            width: 100%;
            padding: 12px;
            font-size: 18px;
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #1976d2;
            color: white;
            font-size: 18px;
        }

        .submit-btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>

<div class="task-card">

    <div class="title">
        Математическая задача
    </div>

    <div class="description"
         th:text="${taskObject.taskDescription}">
    </div>

    <div class="task"
         th:text="${taskObject.taskText}">
    </div>

    <form th:action="@{/math_task_check}" method="post">

        <input type="hidden"
               name="taskId"
               th:value="${taskObject.uuid}">

        <input class="answer-input"
               type="number"
               step="any"
               name="userAnswer"
               placeholder="Введите ответ"
               required>

        <button class="submit-btn" type="submit">
            Проверить ответ
        </button>

    </form>

</div>

</body>
</html>
