<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задачи решены</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .finish-card {
            width: 600px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .description {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .success-icon {
            font-size: 80px;
            color: #2e7d32;
            margin-bottom: 20px;
            animation: pop 0.5s ease;
        }

        .code-container {
            margin-top: 20px;
        }

        .code-label {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .code-number {
            font-size: 72px;
            font-weight: bold;
            color: #1976d2;

            border: 3px dashed #1976d2;
            border-radius: 12px;

            display: inline-block;
            padding: 15px 40px;
        }

        @keyframes pop {
            0% {
                transform: scale(0.3);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

<div class="finish-card">

    <div class="success-icon">
        ✓
    </div>

    <div class="title">
        Поздравляем!
    </div>

    <div class="description">
        Вы успешно решили все математические задачи.
        <br><br>
        В награду получите первую цифру кода:
    </div>

    <div class="code-container">
        <div class="code-label">
            Цифра кода
        </div>

        <div class="code-number"
             th:text="${codeNumber}">
            0
        </div>
    </div>

</div>

</body>
</html>
