server:
    port: 8080
spring:
    datasource:
        username: ${PG_USERNAME}
        password: ${PG_PASSWORD}
        url: jdbc:postgresql://postgres:5432/${PG_DB}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
    sql:
        init:
            mode: always
    spring:
        servlet:
            multipart:
                enabled: true
                max-file-size: 15MB
                max-request-size: 25MB